<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .blau {
            background-color: lightblue;
            width: 400px;
            height: 300px;
            margin-left: 20px;
            margin-top: 20px;
            padding: 20px;
            position: relative;
        }

        .braun {
            background-color: brown;
            right: 0;
            bottom: 0;
            width: 100px;
            height: 100px;
            position: absolute;
        }

        .lila {
            background-color: purple;
            width: 50px;
            height: 50px;
            position: fixed;
            right: 0;
            top: 0;
        }

        .gelb {
            background-color: yellow;
            height: 180px;
            margin-top: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .grün {
            background-color: lightgreen;
            width: 80px;
            height: 80px;
        }
    </style>
</head>

<body>
    <div class="blau">
        <h2>Willkommen!</h2>
        <ul>
            <li>Eins</li>
            <li>Zwei</li>
            <li>Drei</li>
        </ul>
        <div class="braun">

        </div>
    </div>
    <div class="lila"></div>

    <div class="gelb">
        <div class="grün"></div>
        <div class="grün"></div>
        <div class="grün"></div>
        <div class="grün"></div>

    </div>

</body>

</html>
