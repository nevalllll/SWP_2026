<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: darkmagenta;
            padding: 10px;
            /*Innenabstand*/
            height: 100px;
        }

        .container {
            display: grid;
            grid-template-columns: 100%;
            /* breite der spalten */
            grid-auto-rows: minmax(100px, auto);
            column-gap: 2px;
            row-gap: 2px;
        }

        @media (max-width: 700px) {
            .container {
                display: grid;
                grid-template-columns: 33% 33% 33%;
                grid-auto-rows: minmax(100px, auto);
                column-gap: 2px;
                row-gap: 2px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box item1">eins</div>
        <div class="box item2">zwei</div>
        <div class="box item3">drei</div>
        <div class="box item4">vier</div>
        <div class="box item5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti necessitatibus,
            perferendis obcaecati corrupti dolor molestias magnam. Ad optio laboriosam totam, quas rem beatae quo
            doloribus illum voluptas sint illo sapiente.</div>
    </div>
</body>

</html>
